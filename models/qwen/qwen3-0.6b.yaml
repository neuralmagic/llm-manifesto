# Minimal single-GPU Qwen3 deployment using the standard vLLM OpenAI image.
release: qwen3-0-6b
topology: aggregated

model:
  id: Qwen/Qwen3-0.6B
  label: Qwen3-0.6B
  image_ref: vllm.standard

accelerator: b200
routing: {kind: disabled}
runtime: {sidecars: []}

roles:
  - name: decode
    lws: {size: 1}
    parallelism: {tp: 1, dp: false, ep: false}
    resources: {cpu: "8", memory: 32Gi, gpus: 1, ephemeral_storage: 32Gi}
    vllm:
      enable-prompt-tokens-details: true
      enable-auto-tool-choice: true
      tool-call-parser: hermes
