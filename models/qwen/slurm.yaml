# Direct vLLM serving. Each replica is a separate Slurm array element.
release: qwen-slurm
topology: aggregated
model:
  id: Qwen/Qwen3-0.6B
  image_ref: vllm.standard
routing: {kind: disabled}
runtime:
  sidecars: []
  idle_shutdown: {enabled: false}
roles:
  - name: decode
    lws: {size: 1, replicas: 1}
    parallelism: {tp: 1, dp: false}
    resources: {cpu: "8", memory: 32Gi}
