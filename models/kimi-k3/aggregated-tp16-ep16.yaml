# Kimi K3 TEP on GB200 NVL72: TP16/EP16,
# 1 aggregated worker spanning 4 nodes / 16 GPUs.
release: kimi-k3-aggregated-tp16-ep16
topology: aggregated
accelerator: gb200

model:
  id: moonshotai/Kimi-K3
  label: Kimi-K3
  image: vllm/vllm-openai:nightly

routing: {kind: load_aware, target_role: decode}
runtime: {sidecars: [dcgm-exporter, node-exporter]}

vars:
  max_concurrency: 32

roles:
  - name: decode
    workload_name: vllm-kimi-k3
    lws: {size: 4, replicas: 1, same_topology_key: nvidia.com/gpu.clique}
    parallelism: {tp: 16, dp: false, ep: true}
    env:
      VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: "1"
      VLLM_ALLREDUCE_USE_FLASHINFER: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_SSM_CONV_STATE_LAYOUT: DS
      NCCL_CUMEM_ENABLE: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_NVLS_ENABLE: "0"
      DEEPEP_METRICS_ENABLED: "1"
    resources:
      memory: 224Gi
      ephemeral_storage: 128Gi
    vllm:
      load_format: fastsafetensors
      trust_remote_code: true
      gpu_memory_utilization: "0.95"
      max_model_len: 1048576
      max_num_seqs: 32
      max_num_batched_tokens: 32
      moe_backend: deep_gemm_mega_moe
      kv_cache_dtype: fp8
      block_size: 128
      no_disable_hybrid_kv_cache_manager: true
      no_enable_prefix_caching: true
      compilation_config: {cudagraph_mode: FULL_DECODE_ONLY}
      attention-config: '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
