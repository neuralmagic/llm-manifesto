# Python package metadata and tool configuration for the manifesto renderer.
[project]
name = "llm-manifesto"
version = "0.2.0"
description = "Declarative Kubernetes renderer for llm-d and vLLM deployments"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.scripts]
manifesto = "manifesto.cli:main"

[project.urls]
Repository = "https://github.com/neuralmagic/llm-manifesto"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manifesto"]

[tool.hatch.build.targets.wheel.force-include]
"config/images.yaml" = "manifesto/data/images.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
